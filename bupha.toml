# bupha.toml — committed CI manifest for handl-lang/tool-codegen-openapi.
#
# Runner is this repo's ci.sh (cargo xtask gate). Merge the [[repos]]
# entry into the shared watcher (~/.config/bupha/bupha.toml) or run:
# bupha watch --config bupha.toml

[[repos]]
name = "handl-lang/tool-codegen-openapi"
dir = "~/GitHub/handl-lang/tool-codegen-openapi"
branch = "refs/heads/main"
  [repos.runner]
  kind = "script"
  cmd = "bash ci.sh"
  cancel_running = true

[status]
kind = "github"
context = "ci/bupha"
