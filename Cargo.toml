[package]
name = "handl-plugin-codegen-backend-openapi"
version = "0.1.0"
edition = "2024"
description = "OpenAPI backend for the Handl codegen pipeline (P-008 / T-144): handl route maps -> OpenAPI 3.0.x specs, and OpenAPI specs -> handl client/server bindings."
license = "MIT"
repository = "https://github.com/handl-lang/tool-codegen-openapi"
readme = "README.md"
keywords = ["handl", "codegen", "openapi", "swagger", "bindings"]
categories = ["development-tools"]

[dependencies]
# PL-004: the codegen port lives in `handl-plugin-codegen`
# (handl-lang/host); the `[patch]` below resolves it from the sibling
# `../host` checkout. Kernel traits (`Source`/`Emitter`/`Change`/
# `Engine`/`FsStore`) are re-exported by that crate.
handl-plugin-codegen = { git = "https://github.com/handl-lang/host", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tempfile = "3"

[patch."https://github.com/handl-lang/host"]
handl-plugin-codegen = { path = "../host/crates/plugin-codegen" }

[patch."https://github.com/handl-lang/tool-codegen"]
hnl-tool-codegen = { path = "../tool-codegen" }

[patch."https://github.com/handl-lang/engine"]
hnl-engine = { path = "../engine" }

[patch."https://github.com/handl-lang/kernel"]
handl-calculus = { path = "../kernel/crates/handl-calculus" }
handl-language = { path = "../kernel/crates/handl-language" }
handl-value = { path = "../kernel/crates/handl-value" }
